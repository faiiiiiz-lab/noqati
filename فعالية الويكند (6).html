.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,20,15,.82),rgba(10,20,15,.05) 70%)}
.hero .names{position:absolute;z-index:1;right:0;left:0;bottom:0;padding:16px;color:#fff;text-align:center;font-weight:700;line-height:1.7;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.hero .names div{font-size:17px}
.wrap{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px}
.q{font-size:19px;font-weight:700;margin:12px 0 16px}
.prize{display:inline-block;background:var(--gold);color:#222;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:16px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:right;padding:14px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:17px;cursor:pointer}
.opt:active{transform:scale(.99)}
.opt:disabled{opacity:.55;cursor:default}
.msg{margin-top:14px;padding:14px;border-radius:12px;font-size:16px;text-align:center}
.win{background:rgba(47,125,91,.15);color:var(--accent);font-weight:700}
.lose{background:rgba(192,57,43,.12);color:var(--bad)}
.closed{background:rgba(224,168,46,.18)}
.own{margin-top:18px;padding:12px;border:1px dashed var(--line);border-radius:12px;text-align:center}.own b{display:block;font-size:13px;color:var(--mute);margin-bottom:8px}.own button{padding:8px 14px;margin:0 4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;cursor:pointer}
.res{text-align:center}.res .big{font-size:64px;line-height:1.2}.res h2{margin:4px 0 8px;font-size:26px}.res p{margin:4px 0}.wa{display:block;margin-top:18px;padding:14px;border-radius:12px;background:#25d366;color:#053a1a;font-weight:700;text-decoration:none;font-size:17px}
.small{font-size:13px;color:var(--mute);margin-top:12px;text-align:center}
</style>
</head>
<body>
<main>
  <div class="hero"><div class="names"><div>ابتدائية سهل بن عدي الأنصاري</div><div>ومتوسطة عاقل بن البكير</div></div></div>
  <div class="wrap"><div class="card">
    <h1>🎯 فعالية الويكند</h1>
    <p class="sub"><span class="prize">🏆 نقطتين</span> لأول واحد يجاوب صح</p>
    <div id="app"></div>
  </div></div>
</main>
<script>
(function(){
  var QUESTION = "ما الذي يحتاجه النبات لكي ينمو؟ 🌱";
  var OPTIONS = ["الصخور", "الماء والضوء", "الرمل فقط", "الظلام"];
  var CORRECT = 1;

  var app = document.getElementById("app");
  var db = null, myId = "guest-" + Math.random().toString(36).slice(2, 8);
  var winner = null, busy = false, localDone = false, isOwner = false, lastName = "", iWon = false, loading = true, sent = false;
  function isEnded(d){ return !!(d && (d.name || d.closed)); }

  function esc(s){ var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  function render(note){
    var html = "";
    if (loading) { app.innerHTML = '<div class="small">⏳ جارٍ التحميل...</div>'; return; }
    if (iWon) { app.innerHTML = resultScreen() + ownerPanel(); bindSend(); bindOwner(); return; }
    if (winner) {
      if (iWon) html += '<div class="msg win">🎉 <b>ألف مبروك!</b><br>حصلت على <b>نقطتين</b> 🏆<br>🔒 تم إقفال الفعالية<br>📲 أرسل لقطة شاشة للنتيجة إلى <b dir="ltr">0565441887</b></div>';
      else if (winner.name) html += '<div class="msg closed">🔒 <b>انتهت الفعالية!</b><br>لقد حصل عليها <b>' + esc(winner.name) + '</b> 🎉<br>حظًا أوفر 😉</div>';
      else html += '<div class="msg closed">🔒 <b>انتهت الفعالية!</b><br>حظًا أوفر للجميع 😉</div>';
      app.innerHTML = html + ownerPanel(); bindOwner(); return;
    }
    html += '<div class="q">' + esc(QUESTION) + '</div>';
    html += '<input id="nm" placeholder="اكتب اسمك الثلاثي (إلزامي)" maxlength="60" value="' + esc(lastName) + '">';
    OPTIONS.forEach(function(o, i){
      html += '<button class="opt" data-i="' + i + '"' + (busy || localDone ? " disabled" : "") + '>' + ["أ","ب","ج","د"][i] + ") " + esc(o) + '</button>';
    });
    if (note) html += '<div class="msg ' + note.cls + '">' + note.text + '</div>';
    if (!db) html += '<div class="small">ملاحظة: الإغلاق التلقائي ما يشتغل لأنك غير مسجّل دخول. أرسل لقطة شاشة لإجابتك للجروب.</div>';
    app.innerHTML = html + ownerPanel();
    var btns = app.querySelectorAll(".opt");
    for (var k = 0; k < btns.length; k++) btns[k].onclick = onPick;
    bindOwner();
  }

  function resultScreen(){
    var msg = "السلام عليكم، أنا " + lastName + " جاوبت أول واحد في فعالية الويكند وحصلت على نقطتين 🏆";
    var url = "https://wa.me/966565441887?text=" + encodeURIComponent(msg);
    return '<div class="res"><div class="big">🏆</div><h2>ألف مبروك!</h2><p>حصلت على <b>نقطتين</b></p>' +
      (winner ? '<p class="small">🔒 تم إقفال الفعالية</p>' : '') +
      ((sent || (winner && winner.sent)) ? '<div class="msg win">✅ تم إرسال النتيجة</div>' : '<a id="sendBtn" class="wa" href="' + url + '" target="_blank" rel="noopener">📲 أرسل النتيجة</a>') +
      '<div class="small">ابتدائية سهل بن عدي الأنصاري ومتوسطة عاقل بن البكير</div></div>';
  }
  function ownerPanel(){
    if (!isOwner || !db) return "";
    return '<div class="own"><b>لوحة المنظم (تظهر لك فقط)</b><button id="ownClose">🔒 إقفال الفعالية</button><button id="ownReset">♻️ إعادة تعيين</button></div>';
  }
  function bindSend(){
    var b = document.getElementById("sendBtn");
    if (!b) return;
    b.onclick = function(){
      if (sent) return false;
      sent = true;
      if (db) { try { db.doc("event/winner").update({sent:true}).catch(function(){}); } catch(e){} }
      setTimeout(render, 400);
    };
  }
  function bindOwner(){
    var c = document.getElementById("ownClose"), r = document.getElementById("ownReset");
    if (c) c.onclick = async function(){ try { await db.doc("event/winner").set({closed:true, at:Date.now()}); winner = {closed:true}; localDone = false; render(); } catch(e){} };
    if (r) r.onclick = async function(){ try { await db.doc("event/winner").delete(); winner = null; lastName = ""; iWon = false; sent = false; localStorageSet("wonName", ""); localDone = false; busy = false; render(); } catch(e){} };
  }

  function localStorageGet(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } }
  function localStorageSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  async function onPick(e){
    var i = +e.currentTarget.getAttribute("data-i");
    var name = (document.getElementById("nm").value || "").trim();
    var parts = name.split(/\s+/).filter(function(p){ return p.length >= 2; });
    if (parts.length < 3) { render({cls:"lose", text:"لازم تكتب اسمك ثلاثي (الاسم + اسم الأب + اسم الجد) 🙂"}); return; }
    name = parts.join(" ");
    lastName = name;
    if (i !== CORRECT) { render({cls:"lose", text:"إجابة غلط، جرّب مرة ثانية 💪"}); return; }
    if (!db) { iWon = true; render(); return; }
    busy = true; render();
    try {
      var ref = db.doc("event/winner");
      var lease = await ref.acquire({holder: myId, ttlMs: 4000});
      if (!lease.acquired) { busy = false; await refresh(); return; }
      var snap = await ref.get();
      if (snap.exists && isEnded(snap.data())) { winner = snap.data(); }
      else { await ref.set({name: name, at: Date.now()}); winner = {name: name}; iWon = true; localStorageSet("wonName", name); }
    } catch(err) {
      iWon = true;
      busy = false;
      render();
      return;
    }
    busy = false; render(winner && winner.name === name ? {cls:"win", text:"🏆 أنت الفائز!"} : null);
  }

  async function refresh(){
    try {
      var s = await db.doc("event/winner").get();
      if (s.exists && isEnded(s.data())) winner = s.data();
    } catch(e){}
    render();
  }

  render();
  function ready(){ if (loading) { loading = false; render(); } }
  setTimeout(ready, 4000);
  (async function(){
    try {
      if (!window.claude || !window.claude.use) { ready(); return; }
      db = await window.claude.use("db");
      if (!db) { ready(); return; }
      try { var u = await window.claude.use("user"); isOwner = !!(u && u.isOwner()); } catch(e){}
      db.doc("event/winner").onSnapshot(function(s){
        var d = s.exists ? s.data() : null;
        winner = isEnded(d) ? d : null;
        if (!winner) { iWon = false; sent = false; }
        else if (!iWon && !winner.sent && winner.name && localStorageGet("wonName") === winner.name) { iWon = true; lastName = winner.name; }
        loading = false;
        render();
      }, function(){ ready(); });
    } catch(e){ db = null; ready(); }
  })();
})();
</script>
</body>
</html>
