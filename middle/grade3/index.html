<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>فعالية الويكند - الصف الثالث متوسط</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef8f7;color:#17324d}
.card{max-width:560px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 8px 25px #0002}
.hero{height:310px;overflow:hidden;background:#dff3ef}.hero img{width:100%;height:100%;object-fit:cover;display:block}
.content{padding:25px}
h1{text-align:center;margin:0 0 8px;font-size:30px}
.subtitle{text-align:center;color:#687985;margin:0 0 10px;font-size:19px}.schools{text-align:center;color:#555;font-size:15px;line-height:1.8;margin:0 0 25px}
input{display:block;width:100%;padding:16px;border:2px solid #d9e5ea;border-radius:14px;font-size:18px;outline:none;margin-bottom:12px;text-align:center}
.main-btn{display:block;width:100%;padding:16px;border:0;border-radius:14px;background:#1473a5;color:white;font-size:18px;font-weight:bold}
.question{font-size:22px;font-weight:bold;line-height:1.7;margin-bottom:18px}
.option{display:block;width:100%;padding:15px;margin:9px 0;border:2px solid #d9e5ea;border-radius:14px;background:#f6f9fb;color:#17324d;text-align:right;font-size:18px}
.option:disabled{opacity:.65}
.hidden{display:none!important}
.final{text-align:center;padding:25px 5px}
.final-icon{font-size:55px}.final h2{font-size:31px;margin:8px 0}.final p{font-size:22px;line-height:1.8}
 .locked{background:linear-gradient(135deg,#fff7e6,#fff0f2);border:2px solid #f0c36d;border-radius:18px;padding:18px 14px;margin:12px auto 0;text-align:center;line-height:1.65;color:#7a4b00;font-size:18px;font-weight:bold;box-shadow:0 5px 16px #b77b2020;animation:stoppedPulse 2.4s ease-in-out infinite}
.locked .sad-face{display:block;font-size:42px;line-height:1.2;margin:0 0 8px;animation:sadBounce 1.8s ease-in-out infinite;transform-origin:center}
.locked .lock-title{font-size:21px;font-weight:bold;margin:0 0 8px}
.locked .lock-subtitle{font-size:18px;margin:0;font-weight:normal}
.preview-btn{display:block;width:100%;margin-top:12px;padding:11px;border:1px solid #d7ad43;border-radius:12px;background:#fff;color:#79521b;font-size:15px;font-weight:bold}
.preview-note{background:#fff8df;border:2px dashed #d7ad43;border-radius:12px;padding:10px;margin-bottom:14px;color:#79521b;font-size:15px;line-height:1.7}
.option.preview-correct{border:3px solid #18864b;background:#e8fff0;font-weight:bold}
@keyframes sadBounce{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-5px) rotate(-6deg)}60%{transform:translateY(0) rotate(6deg)}}
@keyframes stoppedPulse{0%,100%{box-shadow:0 5px 16px #b77b2020}50%{box-shadow:0 7px 22px #f0c36d66}}
@media(prefers-reduced-motion:reduce){.locked .sad-face,.locked{animation:none}}
#lockedPage{display:none}#lockedPage:not(.hidden){display:block}
#namePage h1,#namePage .subtitle,#namePage .schools{display:block}
@media(max-width:420px){.locked{padding:16px 12px;border-radius:18px}.locked .sad-face{font-size:40px}.locked .lock-title{font-size:19px}.locked .lock-subtitle{font-size:17px}}
</style>
</head>

const lockedPage=document.getElementById("lockedPage");
const nameInput=document.getElementById("studentName");
const options=document.querySelectorAll(".option");
const sendButton=document.getElementById("sendButton");

let eventActive = true;

let teacherPreviewMode=false;
function showStoppedPage(){
 teacherPreviewMode=false;
 questionPage.classList.add("hidden"); finalPage.classList.add("hidden");
 nameInput.classList.add("hidden"); document.getElementById("startButton").classList.add("hidden");
 lockedPage.classList.remove("hidden");
 lockedPage.innerHTML='<div class="sad-face">😔</div><p class="lock-title">الفعالية متوقفة حاليًا ⏸️</p><p class="lock-subtitle">🌟 ننتظركم قريبًا في تحدٍ جديد!</p>';
 if(new URLSearchParams(location.search).get("preview")==="262626"){
  const b=document.createElement("button");b.className="preview-btn";b.type="button";b.textContent="👁️ معاينة السؤال للمعلم";lockedPage.appendChild(b);
  b.onclick=function(){
   teacherPreviewMode=true;lockedPage.classList.add("hidden");namePage.classList.add("hidden");questionPage.classList.remove("hidden");
   let note=document.getElementById("teacherPreviewNote");if(!note){note=document.createElement("div");note.id="teacherPreviewNote";note.className="preview-note";questionPage.insertBefore(note,questionPage.firstChild);}
   const correct=Array.from(options).find(x=>x.dataset.correct==="yes");note.innerHTML='👁️ <strong>وضع معاينة المعلم</strong><br>الإجابة الصحيحة: <strong>'+(correct?correct.textContent:"غير محددة")+'</strong><br>هذه المعاينة لا تسجّل نقاطًا ولا تفتح الفعالية.';
   options.forEach(x=>{x.disabled=true;x.classList.toggle("preview-correct",x.dataset.correct==="yes")});
   let back=document.getElementById("exitTeacherPreview");if(!back){back=document.createElement("button");back.id="exitTeacherPreview";back.className="preview-btn";back.textContent="العودة إلى شاشة الإيقاف";questionPage.appendChild(back)}
   back.onclick=function(){teacherPreviewMode=false;options.forEach(x=>{x.disabled=false;x.classList.remove("preview-correct")});questionPage.classList.add("hidden");note.remove();back.remove();showStoppedPage();};
  };
 }
}
async function checkEventActive(){
 if(teacherPreviewMode)return;
 try{const {data,error}=await supabaseClient.rpc("get_event_active_grade3");if(error){console.error(error);return;}eventActive=data===true;
  if(!eventActive)showStoppedPage();else{lockedPage.classList.add("hidden");nameInput.classList.remove("hidden");document.getElementById("startButton").classList.remove("hidden");}
 }catch(error){console.error(error)}
}
checkEventActive();setInterval(checkEventActive,5000);

document.getElementById("startButton").onclick=function(){
 if(!eventActive){ showStoppedPage(); return; }
 const name=nameInput.value.trim();
 const parts=name.split(/\s+/).filter(Boolean);
 if(parts.length!==3){
  alert("فضلاً اكتب الاسم الثلاثي (ثلاثة أسماء)");
  nameInput.focus();
  return;
 }
 namePage.classList.add("hidden");
 questionPage.classList.remove("hidden");
};

options.forEach(function(button){
 button.onclick=async function(){

  options.forEach(function(b){
   b.disabled=true;
  });

  if(button.dataset.correct==="yes"){

   try{

    const winner=nameInput.value.trim();

    const {data,error}=await supabaseClient.rpc(
   "claim_event_grade3",
     {p_student_name:winner}
    );

    if(error){
     console.error(error);
     alert("حدث خطأ في الاتصال.");
     options.forEach(function(b){
      b.disabled=false;
     });
     return;
    }

    if(data===true){

     questionPage.classList.add("hidden");
     finalPage.classList.remove("hidden");

    }else{

     lockPage();
     return;

    }

   }catch(error){

    console.error(error);
    alert("حدث خطأ في الاتصال.");

    options.forEach(function(b){
     b.disabled=false;
    });

   }

  }else{

   alert("❌ إجابة غير صحيحة.");

   options.forEach(function(b){
    b.disabled=false;
   });

  }
 };
});

sendButton.onclick=function(){

 const winner=nameInput.value.trim();

 const phone="966565441887";

 const text="أحسنت يا بطل، حصلت على نقطتين. اسم الطالب: "+winner;

 window.open(
  "https://wa.me/"+phone+"?text="+encodeURIComponent(text),
  "_blank"
 );

 sendButton.disabled=true;
 sendButton.textContent="تم إرسال النتيجة ✓";

};
</script>
</body>
</html>
