body {

    background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
    min-height: 100vh;

}

button:disabled {

}

.option {
    background: #f5f5f5;

}

.option:hover {
    background: #e3f2fd;
}

.success {

}

.points {
    font-size: 24px;
    font-weight: bold;
    margin: 20px 0;
}

.locked {
    font-size: 22px;
    font-weight: bold;
}

.hidden {
    display: none;
}

.small {
    color: #777;
    font-size: 14px;
    margin-top: 20px;
}

</style>
</head>
